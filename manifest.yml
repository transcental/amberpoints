{
    "display_information": {
        "name": "Slack Extra",
        "description": "Convenient features you wish were built into Slack",
        "background_color": "#e02510"
    },
    "features": {
        "bot_user": {
            "display_name": "Slack Extra",
            "always_online": false
        }
    },
    "oauth_config": {
        "scopes": {
            "bot": [
                "chat:write"
            ]
        }
    },
    "settings": {
        "org_deploy_enabled": false,
        "socket_mode_enabled": false,
        "token_rotation_enabled": false
    }
}